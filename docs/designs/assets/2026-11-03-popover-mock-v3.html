<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Till popover rework v3</title>
<style>
/* Scale (pt): 4 · 8 · 12 · 16 · 24.  Radii are concentric: popover 30 = tile 20 + 10 padding.
   Neutral calm tiles; fill is reserved for state (amber outline = due soon, red fill = overdue). */
:root{
  --ink:#f6f8fc; --ink-2:rgba(246,248,252,.82); --ink-3:rgba(246,248,252,.66);
  --amber:#ffc15e; --red:#cf2f36;
  --tile:rgba(255,255,255,.10); --hair:rgba(255,255,255,.16);
  --mono: ui-monospace,"SF Mono","SFMono-Regular","DejaVu Sans Mono",monospace;
  --text: -apple-system,"SF Pro Text",system-ui,"Liberation Sans",sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--text);color:var(--ink);padding:40px;width:1240px;min-height:100vh;display:grid;grid-template-columns:repeat(3,340px);column-gap:40px;row-gap:44px;
  background:radial-gradient(900px 600px at 15% 5%,#9cc2ff 0,transparent 60%),radial-gradient(900px 700px at 90% 70%,#5a7fd6 0,transparent 60%),linear-gradient(160deg,#79a6f2,#4a6fc2 60%,#6aa3e0)}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font:13px/1.45 var(--text);color:rgba(8,18,46,.82);min-height:56px}.cap b{color:#06102c}
.pop{border-radius:30px;padding:10px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(180deg,rgba(40,62,110,.82),rgba(26,44,88,.88));backdrop-filter:blur(30px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 .5px rgba(8,16,48,.6),0 20px 44px rgba(20,40,110,.38)}
.head{display:flex;gap:8px;align-items:center}
.field{flex:1;height:40px;border-radius:20px;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--hair);display:flex;align-items:center;gap:8px;padding:0 12px 0 7px;font:15px var(--text)}
.field .t{width:26px;height:26px;border-radius:13px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.field .t svg{width:16px;height:16px;fill:#fff;shape-rendering:crispEdges}
.ph{color:var(--ink-3)} .v{color:var(--ink)} .field span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .lab{margin-left:auto;font-size:13px;color:var(--ink-3);padding-left:8px;white-space:nowrap}
.field .lab.v{color:var(--ink-2)}
.gear{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3);font-size:18px;position:relative;flex:none}
.gear.alert::after{content:"";position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:5px;background:var(--amber);box-shadow:0 0 0 2px rgb(40,62,110)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.chip{--a:#ff7fbf;border-radius:20px;padding:10px 6px 6px;background:var(--tile);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px var(--hair);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.chip svg.px{width:40px;height:40px;fill:var(--a);shape-rendering:crispEdges;margin-bottom:2px}
.lab2{font:500 12px/16px var(--text);color:var(--ink-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}
.hero{font:700 26px/28px var(--mono);letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.sub{font:600 12px/14px var(--text);height:14px;color:transparent}
.ctl{margin-top:auto;align-self:stretch;height:28px;border-radius:12px;display:grid;place-items:center}  /* whole strip is the hit target */
.ctl svg{width:14px;height:14px;fill:var(--ink)}
.chip.approaching{box-shadow:inset 0 0 0 2px var(--amber)}
.chip.approaching{background:rgba(8,16,44,.28)}.chip.approaching .hero{color:var(--amber)}.chip.approaching .sub{color:#ffd993}
.chip.overdue{background:var(--red);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.chip.overdue svg.px{fill:#fff}.chip.overdue .lab2{color:#fff}.chip.overdue .sub{color:#fff}
.chip.overdue .ctl{background:rgba(0,0,0,.28);font:600 13px var(--text);color:#fff}
.chip.paused{background:transparent;box-shadow:inset 0 0 0 1.5px var(--hair);outline:none;border:1.5px dashed rgba(255,255,255,.28);padding:8.5px 4.5px 4.5px}
.chip.paused svg.px{opacity:.5}.chip.paused .hero{color:var(--ink-2)}.chip.paused .lab2{color:var(--ink-3)}.chip.paused .sub{color:var(--ink-3)}

.picker{border-radius:20px;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--hair);padding:8px;display:flex;flex-direction:column;gap:8px}
.sfield{height:32px;border-radius:16px;background:rgba(0,0,0,.2);padding:0 12px;display:flex;align-items:center;font:14px var(--text)}
.r{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.r i{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.r i.sel{box-shadow:inset 0 0 0 2px #fff;background:rgba(255,255,255,.18)}
.r svg{width:24px;height:24px;fill:var(--ink);shape-rendering:crispEdges}
.note{font:12px/16px var(--text);color:var(--ink-2)}
.note.err{color:#fff;background:rgba(207,47,54,.55);border-radius:12px;padding:8px 12px}
.builtin{display:flex;align-items:center;gap:8px;border-top:.5px solid var(--hair);padding-top:8px}
.builtin span{font:12px var(--text);color:var(--ink-3);margin-right:auto}
.builtin i{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.builtin svg{width:16px;height:16px;fill:var(--ink);shape-rendering:crispEdges}
.echo{font:12px var(--text);color:var(--ink-2);padding:0 12px}.echo b{color:var(--ink)}
.empty{text-align:center;padding:24px 12px 20px}
.empty svg{width:56px;height:56px;fill:var(--ink-3);shape-rendering:crispEdges}
.empty h3{font:600 17px/24px var(--text);margin-top:8px}
.empty p{font:13px/18px var(--text);color:var(--ink-2);margin-top:4px}
.eg{display:flex;gap:8px;justify-content:center;margin-top:16px}
.eg span{font:500 12px var(--mono);background:var(--tile);box-shadow:inset 0 0 0 .5px var(--hair);padding:8px 12px;border-radius:999px}
</style></head><body>
<script>
const SPR={
 creature:["..XXXX..",".XXXXXX.","XX.XX.XX","XXXXXXXX",".X.XX.X.",".X....X.","X.X..X.X","........"],
 heart:[".XX..XX.","XXXXXXXX","XXXXXXXX","XXXXXXXX",".XXXXXX.","..XXXX..","...XX...","........"],
 cup:["..X.X...","........","XXXXXX..","XXXXXXXX","XXXXXX.X","XXXXXXX.",".XXXXX..","........"],
 handset:[".XXXXX..",".X...X..",".X...X..",".X...X..",".XXXXX..",".XXXXX..",".XX.XX..",".XXXXX.."],
 bell:["...XX...","..XXXX..",".XXXXXX.",".XXXXXX.",".XXXXXX.","XXXXXXXX","........","...XX..."],
 flame:["...X....","...XX...","..XXX.X.",".XXXXXX.",".XXXXXXX",".XXXXXX.","..XXXX..","........"],
 timer:["..XXXX..",".X.XX.X.","X..XX..X","X..XXX.X","X......X",".X....X.","..XXXX..","........"],
 car:["........","..XXXX..",".XXXXXX.","XXXXXXXX","XXXXXXXX","X.XXXX.X",".X....X.","........"],
 pill:["........","..XXXX..",".XXXXXX.",".XXX.XX.",".XXX.XX.",".XXXXXX.","..XXXX..","........"]};
function sp(n,c){const g=SPR[n];let r='';g.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='X')r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}));return `<svg ${c?`class="${c}"`:''} viewBox="0 0 8 8">${r}</svg>`}
const PAUSE='<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.4" height="12" rx="1"/><rect x="9.6" y="2" width="3.4" height="12" rx="1"/></svg>';
const PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8A.8.8 0 0 0 4 2.2z"/></svg>';
const P={sky:'#6fcfff',green:'#8fe0a0',violet:'#c58bff',rose:'#ff7fbf',teal:'#5ee0cf',peri:'#a3acff'};
function chip({s='',a,i,l='',h,sub='&nbsp;',c}){return `<div class="chip ${s}" style="--a:${a}">${sp(i,'px')}<div class="lab2">${l}</div><div class="hero">${h}</div><div class="sub">${sub}</div><div class="ctl">${c}</div></div>`}
function head({icon='timer',when,what,whenPh,gear=''}){return `<div class="head"><div class="field"><div class="t">${sp(icon)}</div>${when?`<span class="v">${when}</span>`:`<span class="ph">${whenPh}</span>`}${what?`<span class="lab v">${what}</span>`:`<span class="lab">Label</span>`}</div><div class="gear ${gear}">⚙</div></div>`}
const BI=['timer','bell','cup','handset','car','flame'].map(n=>`<i>${sp(n)}</i>`).join('');
const built=`<div class="builtin"><span>Built in</span>${BI}</div>`;
const grid6=['cup','creature','heart','bell','flame','timer','heart','cup','bell','flame','car','creature'].map((n,i)=>`<i class="${i==0?'sel':''}">${sp(n)}</i>`).join('');
const WHEN='in 20 min, Fri 5pm';
const cols=[
 ['<b>Populated.</b> Counting tiles are one neutral fill; the accent lives on the icon. Fill and outline mean state: amber outline, red fill, dashed hollow for paused. The caption slot says it in words. The gear shows a dot when a setting needs attention.',
  `<div class="pop">${head({whenPh:WHEN,gear:'alert'})}<div class="grid">${[
   chip({a:P.rose,i:'creature',l:'Pasta',h:'12:40',c:PAUSE}),
   chip({s:'approaching',a:P.green,i:'cup',l:'Standup',h:'04:12',sub:'due soon',c:PAUSE}),
   chip({s:'overdue',a:P.sky,i:'handset',l:'Call mum',h:'+41m',sub:'overdue',c:'Done'}),
   chip({a:P.violet,i:'bell',l:'Flight',h:'3d 14h',c:PAUSE}),
   chip({s:'paused',a:P.teal,i:'pill',l:'Pills',h:'14h 32m',sub:'paused',c:PLAY}),
   chip({a:P.peri,i:'flame',l:'',h:'1h 05m',c:PAUSE})].join('')}</div></div>`],
 ['<b>Adding, with results.</b> Search field, results, then built-ins, which always work offline. The disclosure line is for the highlighted icon only.',
  `<div class="pop">${head({when:'Fri 5pm',what:'Submit expenses',icon:'cup'})}<div class="echo">Friday <b>5:00 PM</b>, in 2 d 3 h</div>
   <div class="picker"><div class="sfield">coffee</div><div class="r">${grid6}</div><div class="note">Pixelarticons · MIT · single color, takes the chip’s color</div>${built}</div></div>`],
 ['<b>Empty.</b> The examples are real parser inputs and fill the field on click.',
  `<div class="pop">${head({whenPh:WHEN})}<div class="empty">${sp('creature')}<h3>Nothing counting down</h3><p>Type when it’s due.<br>Till tells you when time’s up.</p><div class="eg"><span>in 20 min</span><span>Fri 5pm</span><span>Nov 15</span></div></div></div>`],
 ['<b>Picker: searching.</b> Static text, no spinner. The field stays editable.',
  `<div class="pop">${head({when:'Fri 5pm',icon:'timer'})}<div class="picker"><div class="sfield">coffee</div><div class="note">Searching…</div>${built}</div></div>`],
 ['<b>Picker: no results.</b> Says what happened and what to try. Never blank.',
  `<div class="pop">${head({when:'Fri 5pm',icon:'timer'})}<div class="picker"><div class="sfield">qzxv</div><div class="note">No icons match “qzxv”. Try a simpler word, such as coffee or bell.</div>${built}</div></div>`],
 ['<b>Picker: service unreachable.</b> Names the problem and the way forward; built-ins stay usable.',
  `<div class="pop">${head({when:'Fri 5pm',icon:'timer'})}<div class="picker"><div class="sfield">coffee</div><div class="note err">Can’t reach the icon service. Check your connection, or pick a built-in icon.</div>${built}</div></div>`]
];
document.write(cols.map(([c,h])=>`<div class="col"><div class="cap">${c}</div>${h}</div>`).join(''));
</script>
</body></html>
